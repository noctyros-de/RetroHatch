[package]
name = "retrohatch"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Finn Lülsdorf (Noctyros)"]
repository = "https://github.com/noctyros-de/RetroHatch"
readme = "../README.md"
publish = false
description = "Native Windows Tamagotchi P1, P2, Genjintch, Angel, Morino and Umino emulator with a deterministic Rust core"

[[bin]]
name = "RetroHatch"
path = "src/main.rs"

[dependencies]
tg18-core = { path = "third_party/tg18-core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_UI_Controls_Dialogs", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

# The reused ARM interpreter needs optimization even in development builds.
[profile.dev.package.tg18-core]
opt-level = 2
