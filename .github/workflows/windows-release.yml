name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Detect a new application version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out the exact main commit and history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Plan an immutable version release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B app/tools/auto_release.py plan

  release:
    name: Verify, build and publish Windows distribution
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    concurrency:
      group: retrohatch-release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact verified candidate and history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the audited Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          rustup default 1.99.1
          if ($LASTEXITCODE -ne 0) { throw 'Rust selection failed' }

      - name: Check, test and build the Windows executable
        working-directory: app
        run: |
          & ./tools/build_release.ps1 -ConfigureOnly
          cargo fmt --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting check failed' }
          cargo check --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cargo check failed' }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { throw 'Rust tests failed' }
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }
          python -B tools/test_audit_licenses.py
          if ($LASTEXITCODE -ne 0) { throw 'License inventory regression tests failed' }
          python -B tools/audit_licenses.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency notice inventory is stale' }
          python -B tools/test_package_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaging tests failed' }
          python -B tools/test_auto_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Automatic release tests failed' }

      - name: Package Windows and matching source archives
        run: |
          python -B app/tools/package_release.py --tag $env:RELEASE_TAG --output dist
          if ($LASTEXITCODE -ne 0) { throw 'Release packaging failed' }

      - name: Verify an independent offline source build
        run: |
          $sourceZip = Get-Item "dist/RetroHatch-$env:RELEASE_TAG-source.zip"
          $sourceRoot = Join-Path $env:RUNNER_TEMP 'retrohatch-source-check'
          Expand-Archive -LiteralPath $sourceZip.FullName -DestinationPath $sourceRoot
          Push-Location (Join-Path $sourceRoot 'app')
          try {
            $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'retrohatch-source-target'
            & ./tools/build_release.ps1 -ConfigureOnly
            cargo build --release --locked --offline
            if ($LASTEXITCODE -ne 0) { throw 'Independent source build failed' }
          } finally { Pop-Location }

      - name: Tag and publish verified files with automatic release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B app/tools/auto_release.py publish --dist dist
          if ($LASTEXITCODE -ne 0) { throw 'Safe release publication failed; inspect the run diagnostics' }
